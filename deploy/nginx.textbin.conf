# Ставится в /etc/nginx/snippets/nikitosfrolov/textbin.conf. Сайт nikitosfrolov.ru
# подключает всю папку строкой include snippets/nikitosfrolov/*.conf;
# Это делает ./deploy.sh --nginx.
#
# Префикс НЕ срезаем: сервис знает про него сам (BASE_PATH=/textbin),
# поэтому proxy_pass без завершающего слэша.

location /textbin/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}

location = /textbin {
    return 301 /textbin/;
}
